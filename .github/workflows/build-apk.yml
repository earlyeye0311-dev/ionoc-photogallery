name: Build Ionic Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Ionic app
      - name: Build Ionic app
        run: npm run build

      # 5. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 7. Grant execute permission to Gradlew
      - name: Grant execute permission to Gradlew
        run: chmod +x ./android/gradlew

      # 8. Build Android APK (Debug)
      - name: Build Android APK
        run: cd android && ./gradlew assembleDebug

      # --------------------------------------------------
      # 9. Rename the generated APK
      # --------------------------------------------------
      - name: Rename to PhotoGallery.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PhotoGallery.apk

      # --------------------------------------------------
      # 10. Upload APK to GitHub Actions
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoGallery-APK
          path: PhotoGallery.apk
          if-no-files-found: error
          retention-days: 30